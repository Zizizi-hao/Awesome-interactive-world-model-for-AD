name: Check README sync

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/generate_readme.py
      - name: Verify both READMEs are in sync with data.yaml
        run: |
          if ! git ls-files --error-unmatch -- README.md README.en.md > /dev/null 2>&1; then
            echo "::error::Commit both generated READMEs: README.md and README.en.md."
            exit 1
          fi
          if ! git diff --exit-code -- README.md README.en.md; then
            echo "::error::READMEs are out of sync. Run 'python3 scripts/generate_readme.py' and commit both results."
            exit 1
          fi
