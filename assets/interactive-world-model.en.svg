  <text x="76" y="101" fill="#182f49" font-size="36" font-weight="700">Interactive world models: from prediction to closed-loop decisions</text>
  <text x="76" y="140" fill="#697e97" font-size="20">Predict action-conditioned futures; use imagination for planning, policy learning, and real interaction.</text>
