      <rect x="51" y="12" width="9" height="18" rx="3" fill="#b6c9d7" stroke="#eef2f5"/>
      <rect x="49" y="40" width="11" height="22" rx="3" fill="#3478ee" stroke="#eef2f5"/>
      <path d="M52 47H57" stroke="#c6e3ff" stroke-width="3"/>
    </g>
  </defs>
