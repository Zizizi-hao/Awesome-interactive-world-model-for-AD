<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" font-family="Arial, Helvetica, sans-serif">
  <title>Interactive world models: from prediction to closed-loop decisions</title>
  <desc>Observations enter an action-conditioned world model. Imagined futures support planning and policy learning. Selected actions are executed in the real environment, whose observations and rewards update the history. Predictions are distinct from real feedback.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f3f8ff"/></linearGradient>
    <linearGradient id="world" x2="1" y2="1"><stop stop-color="#182f49"/><stop offset="1" stop-color="#244963"/></linearGradient>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#3478ee"/></marker>
    <marker id="gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#8a9cb0"/></marker>
    <marker id="teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#14a7a0"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#20a783"/></marker>
