    category: driving
    links:
      arxiv: "2311.16038"
      code: "https://github.com/wzzheng/OccWorld"
    features: {}
    tags: [3D占用栅格, 联合预测]
    note: 基于 3D 占用栅格的世界模型，在统一框架内联合预测未来场景演化与自车轨迹，无需高精地图与人工标注。

  - title: "Generalized Predictive Model for Autonomous Driving"
