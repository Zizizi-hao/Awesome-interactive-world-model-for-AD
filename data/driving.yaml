    note: 面向自动驾驶的大规模视频预测模型，通过未来帧预测任务学习驾驶场景中的世界知识。

  - title: "MagicDrive: Street View Generation with Diverse 3D Geometry Control"
    short: MagicDrive
    org: UCLA (cure-lab)
    year: 2023
    venue: ICLR 2024
    category: driving
    links:
      arxiv: "2310.02601"
