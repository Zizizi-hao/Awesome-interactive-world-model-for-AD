    tags: [多视角, 帧级动作, 位姿记忆, 策略仿真]
    note: 从 1.5B Stable Video Diffusion 微调成多视角动作条件世界模型，用位姿条件的记忆检索维持长时程。在 DROID（约 9.5 万条轨迹、564 个场景）上训练，新场景和新相机布置下可展开超过 20 秒。验证集 256 段 10 秒轨迹上，第三人称 FVD 为 97.4，单视角版本为 127.5，IRASim 单视角为 138.1。想象里筛出的成功轨迹用来监督微调 π0.5，陌生指令和物体上的成功率从 38.7% 到 83.4%。成功与否由人工判断。指令跟随与真机接近，但会低估底层执行成功率。
    note_en: "Fine-tunes 1.5B Stable Video Diffusion into a multi-view, action-conditioned world model, using pose-conditioned memory retrieval to maintain long horizons. Trained on DROID (approximately 95,000 trajectories across 564 scenes), it can roll out for more than 20 s with new scenes and camera arrangements. On 256 held-out 10-second trajectories, third-person FVD is 97.4, compared with 127.5 for the single-view version and 138.1 for single-view IRASim. Successful trajectories selected in imagination supervise π0.5 fine-tuning, raising success on unfamiliar instructions and objects from 38.7% to 83.4%. Success is judged manually. Instruction following is close to real-robot performance, but low-level execution success is underestimated."

  - title: "AVL-JEPA: Preventing Causal Dynamics Information Collapse in Joint Embedding Predictive Architecture World Models"
    short: AVL-JEPA
    org: 中南大学 / 燕山大学
    org_en: "Central South University / Yanshan University"
    year: 2026
    venue: arXiv
    category: embodied
    links:
      arxiv: "2610.03587"
    features: {action: true, closedloop: true}
    tags: [因果动力学, JEPA, 视觉干扰, 闭环规划]
    note: JEPA 可以保住高维视觉信息，同时丢掉动作造成的物理变化。AVL 用已执行动作锚定动力学，再把受视觉干扰的潜预测对齐到干净预测，动作头保持冻结。高斯输入噪声下，PushT 成功率从 15.3% 到 81.5%，TwoRoom 从 65.7% 到 88.7%。干净的 OGBench Cube 从 73.2% 到 78.2%。
    note_en: "JEPA can preserve high-dimensional visual information while discarding physical changes caused by actions. AVL anchors dynamics with executed actions, then aligns latent predictions affected by visual distractors with clean predictions while keeping the action head frozen. Under Gaussian input noise, PushT success rises from 15.3% to 81.5% and TwoRoom from 65.7% to 88.7%. On clean OGBench Cube, it rises from 73.2% to 78.2%."

