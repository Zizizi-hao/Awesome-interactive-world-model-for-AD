    note_en: "First predicts a visual subgoal for the next subtask, then jointly generates future frames and actions conditioned on that subgoal; both components share a pretrained world model. On RoboTwin, success is 82.00% on Clean and 67.02% on Random, averaging 74.51%, compared with 4D-WAM's 61.65% average. Removing visual subgoals from the same Cosmos3-Nano backbone yields 22.46% on Random. Real-robot evaluation uses five long-horizon compositional tasks on AgiBot A2."

