    note: 在五个冻结视觉骨干上测动作条件预测器还能规划多远。按五步展开训练时，动作排序只在目标位于未来 5 到 10 个控制步时可靠，而任务目标在 16 到 53 步之外。预测器放大 81 倍或把训练展开加长，都没有拉开这个范围。换成完美的真仿真器，目标从展开末端再往前 5 步移到 20 步时，成功率从 92% 降到 41%。纯想象成功 23%，带反馈的模型预测控制 30%，想象到目标处 47%，近处专家子目标 76%。在可规划范围内，从视觉–语言–动作策略提出的 8 个动作里挑选，16 个任务的成功率从 65% 到 77%。V-JEPA 2.1 最稳。
    note_en: "Tests how far action-conditioned predictors can plan over five frozen visual backbones. With five-step rollout training, action rankings are reliable only when goals lie 5 to 10 control steps ahead, whereas task goals are 16 to 53 steps away. Scaling the predictor by 81× or extending training rollouts does not widen this range. Even with a perfect ground-truth simulator, moving the goal from 5 to 20 steps beyond the rollout endpoint lowers success from 92% to 41%. Success is 23% with pure imagination, 30% with feedback-based model predictive control, 47% when imagining all the way to the goal, and 76% with nearby expert subgoals. Within the plannable range, selecting among 8 actions proposed by a vision-language-action policy raises success across 16 tasks from 65% to 77%. V-JEPA 2.1 is the most robust."

