      arxiv: "2610.02691"
    features: {action: true, longhorizon: true}
    tags: [潜增量, 动作条件, 交互对齐, 操作仿真]
    note: 不直接预测下一帧潜状态，而是预测动作引起的潜变量增量并加回当前状态，交互区域用反事实掩码加重监督。IWS 五项任务、两个视角上，FVD 从 264.52 降到 231.98，LPIPS 从 0.0661 降到 0.0490。自采的三台机器人、四项任务上，FVD 从 168.98 降到 90.31。评测是动作条件视频预测。
    note_en: "Instead of directly predicting the next latent state, predicts action-induced latent increments and adds them to the current state, using counterfactual masks to strengthen supervision in interaction regions. Across five IWS tasks and two views, FVD decreases from 264.52 to 231.98 and LPIPS from 0.0661 to 0.0490. On self-collected data covering three robots and four tasks, FVD decreases from 168.98 to 90.31. Evaluation concerns action-conditioned video prediction."

